<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Online Tools</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 15px;
    }

    h1 {
      margin: 0 0 10px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input {
      width: 90%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin: 15px 0;
      font-size: 16px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .tools {
      margin-top: 30px;
      display: grid;
      gap: 15px;
    }

    .tool {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>My Online Tools</h1>
  <p>Simple tools for everyday digital tasks</p>
</header>

<div class="container">

  <div class="box">
    <h2>Useful Online Tools</h2>
    <p>Paste a permitted media URL below to process it.</p>

    <input type="url" placeholder="Paste your URL here">

    <br>

    <button onclick="alert('Tool coming soon!')">
      Process
    </button>
  </div>

  <div class="tools">
    <div class="tool">🖼️ Image Tools</div>
    <div class="tool">📄 PDF Tools</div>
    <div class="tool">🎬 Video Tools</div>
    <div class="tool">🎵 Audio Tools</div>
    <div class="tool">🔳 QR Code Generator</div>
  </div>

</div>

<footer>
  © 2026 My Online Tools. All rights reserved.
</footer>

</body>
      </html>
